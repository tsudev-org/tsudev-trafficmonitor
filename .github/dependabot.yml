# Tự động đề xuất cập nhật GitHub Actions và phụ thuộc npm của website (vá lỗ hổng chuỗi cung ứng)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    # Chỉ đề xuất bản đã phát hành ít nhất 7 ngày (giảm rủi ro gói độc hại mới đăng)
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]
    commit-message:
      prefix: "website"
