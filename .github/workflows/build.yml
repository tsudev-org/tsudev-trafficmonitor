# Build kiểm tra cho mỗi lần push/PR: bản Lite cho x86, x64, ARM64EC + kiểm tra bản Việt hóa
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quyền tối thiểu: chỉ đọc mã nguồn
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    name: Kiểm tra Việt hóa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Kiểm tra gói ngôn ngữ và mã nguồn
        run: python3 -I tools/check_i18n.py
      - name: Kiểm tra URL (chỉ HTTPS, danh sách cho phép, URL C++ chỉ ở ForkConfig.h)
        run: python3 -I tools/check_urls.py

  unit-tests:
    name: Kiểm thử C++
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build và chạy tests/UpdateSecurityTests.cpp (x64)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /sdl /I TrafficMonitor tests\UpdateSecurityTests.cpp /Fe:UpdateSecurityTests.exe || exit /b 1
          UpdateSecurityTests.exe tests\fixtures
      - name: Chạy lại kiểm thử dưới AddressSanitizer
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /Zi /fsanitize=address /I TrafficMonitor tests\UpdateSecurityTests.cpp /Fe:UpdateSecurityTestsAsan.exe || exit /b 1
          UpdateSecurityTestsAsan.exe tests\fixtures
      - name: Fuzzing logic cập nhật (libFuzzer + ASan, 120 giây)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /Zi /fsanitize=address /fsanitize=fuzzer /I TrafficMonitor tests\fuzz\UpdateSecurityFuzz.cpp /Fe:UpdateSecurityFuzz.exe || exit /b 1
          mkdir fuzz-corpus
          xcopy /q /y tests\fuzz\corpus\* fuzz-corpus\ >nul
          UpdateSecurityFuzz.exe -max_total_time=120 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 fuzz-corpus
      - name: Lưu đầu vào gây lỗi của fuzzer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ github.sha }}
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.platform }}
    needs: i18n-check
    runs-on: windows-2022   # Ghim VS 2022 (v143 + MFC); windows-latest dùng VS 2026 chưa có MFC cho v143
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            outdir: Bin/x64/Release (lite)
          - platform: x86
            outdir: Bin/Release (lite)
          - platform: ARM64EC
            outdir: Bin/ARM64EC/Release (lite)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Thêm MSBuild vào PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Build TrafficMonitor (Lite)
        env:
          # Coi các cảnh báo ép kiểu số / cắt con trỏ / ký tự ngoài code page là lỗi để không phát sinh lại
          CL: /we4244 /we4267 /we4018 /we4302 /we4311 /we4566
        run: msbuild TrafficMonitor_Lite.sln -m -p:Configuration="Release (lite)" -p:Platform=${{ matrix.platform }} -p:PlatformToolset=v143

      - name: Kiểm tra cờ bảo mật của tệp thực thi
        shell: pwsh
        run: |
          $exe = Join-Path "${{ matrix.outdir }}" "TrafficMonitor.exe"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $headers = & $dumpbin /headers /loadconfig $exe | Out-String
          $required = @("Dynamic base", "NX compatible", "Guard")
          if ("${{ matrix.platform }}" -ne "ARM64EC") { $required += "CET compatible" }
          $missing = $required | Where-Object { $headers -notmatch [regex]::Escape($_) }
          if ($missing) { Write-Error "Thiếu cờ bảo mật: $($missing -join ', ')"; exit 1 }
          Write-Host "Đủ cờ bảo mật: $($required -join ', ')"

      - name: Tải lên artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: TrafficMonitor-VN_${{ matrix.platform }}_Lite_${{ github.sha }}
          path: |
            ${{ matrix.outdir }}/TrafficMonitor.exe
            ${{ matrix.outdir }}/*.dll
            ${{ matrix.outdir }}/*.pdb
          if-no-files-found: error
          retention-days: 14

  build-full:
    # Bản đầy đủ (có đo nhiệt độ qua OpenHardwareMonitorApi C++/CLI) không phát hành, nhưng vẫn build để
    # bắt cảnh báo/lỗi trong mã #ifndef WITHOUT_TEMPERATURE. Không phải check bắt buộc của PR.
    name: Build bản đầy đủ x64 (không phát hành)
    needs: i18n-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Thêm MSBuild vào PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Build TrafficMonitor (bản đầy đủ)
        env:
          CL: /we4244 /we4267 /we4018 /we4302 /we4311 /we4566
        run: msbuild TrafficMonitor.sln -m -restore -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143
