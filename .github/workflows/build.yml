# Build kiểm tra cho mỗi lần push/PR: bản Lite cho x86, x64, ARM64EC + kiểm tra bản Việt hóa
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quyền tối thiểu: chỉ đọc mã nguồn
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    name: Kiểm tra Việt hóa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Kiểm tra gói ngôn ngữ và mã nguồn
        run: python3 -I tools/check_i18n.py
      - name: Kiểm tra URL (chỉ HTTPS, danh sách cho phép, URL C++ chỉ ở ForkConfig.h)
        run: python3 -I tools/check_urls.py

  unit-tests:
    name: Kiểm thử C++
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build và chạy tests/UpdateSecurityTests.cpp (x64)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /sdl /I TrafficMonitor tests\UpdateSecurityTests.cpp /Fe:UpdateSecurityTests.exe || exit /b 1
          UpdateSecurityTests.exe tests\fixtures
      - name: Kiểm thử tích hợp tự tải gói cập nhật + kiểm SHA-256 (gói 26.11.0904 thật, có ASan)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /sdl /Zi /fsanitize=address /I TrafficMonitor tests\UpdateDownloadTests.cpp /Fe:UpdateDownloadTests.exe || exit /b 1
          UpdateDownloadTests.exe
      - name: Thử sinh SBOM trên Windows (như release.yml)
        shell: bash
        run: |
          set -euo pipefail
          echo thu > sbom-thu.zip
          python -I -X utf8 tools/make_sbom.py --zip sbom-thu.zip --version 1.0 --commit "$(git rev-parse HEAD)" > sbom-thu.spdx.json
          python -I -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['spdxVersion']=='SPDX-2.3' and len(d['packages'])==3" sbom-thu.spdx.json
      - name: Chạy lại kiểm thử dưới AddressSanitizer
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /Zi /fsanitize=address /I TrafficMonitor tests\UpdateSecurityTests.cpp /Fe:UpdateSecurityTestsAsan.exe || exit /b 1
          UpdateSecurityTestsAsan.exe tests\fixtures
      - name: Fuzzing logic cập nhật (libFuzzer + ASan, 120 giây)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /Zi /fsanitize=address /fsanitize=fuzzer /I TrafficMonitor tests\fuzz\UpdateSecurityFuzz.cpp /Fe:UpdateSecurityFuzz.exe || exit /b 1
          mkdir fuzz-corpus
          xcopy /q /y tests\fuzz\corpus\* fuzz-corpus\ >nul
          UpdateSecurityFuzz.exe -max_total_time=120 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 fuzz-corpus
      - name: Kiểm thử phân tích XML (skin.xml, thông tin phiên bản) - thường và ASan
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir xml-thuong xml-asan
          cl /nologo /c /std:c++17 /EHsc /W3 /utf-8 /Foxml-thuong\ TrafficMonitor\tinyxml2\tinyxml2.cpp || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /sdl /I TrafficMonitor tests\XmlParsingTests.cpp xml-thuong\tinyxml2.obj /Fe:XmlParsingTests.exe || exit /b 1
          XmlParsingTests.exe TrafficMonitor\skins || exit /b 1
          cl /nologo /c /std:c++17 /EHsc /W3 /utf-8 /Zi /fsanitize=address /Foxml-asan\ TrafficMonitor\tinyxml2\tinyxml2.cpp || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /Zi /fsanitize=address /I TrafficMonitor tests\XmlParsingTests.cpp xml-asan\tinyxml2.obj /Fe:XmlParsingTestsAsan.exe || exit /b 1
          XmlParsingTestsAsan.exe TrafficMonitor\skins
      - name: Fuzzing phân tích skin.xml (libFuzzer + ASan, 120 giây; hạt giống là skin.xml thật)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir xml-fuzz skin-corpus
          cl /nologo /c /std:c++17 /EHsc /utf-8 /Zi /fsanitize=address /fsanitize=fuzzer /Foxml-fuzz\ TrafficMonitor\tinyxml2\tinyxml2.cpp || exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /Zi /fsanitize=address /fsanitize=fuzzer /I TrafficMonitor tests\fuzz\SkinXmlFuzz.cpp xml-fuzz\tinyxml2.obj /Fe:SkinXmlFuzz.exe || exit /b 1
          for /d %%d in (TrafficMonitor\skins\*) do if exist "%%d\skin.xml" copy /y "%%d\skin.xml" "skin-corpus\%%~nxd.xml" >nul
          copy /y tests\fixtures\version_signed.xml skin-corpus\version_signed.xml >nul
          SkinXmlFuzz.exe -max_total_time=120 -timeout=10 -rss_limit_mb=2048 -max_len=65536 -print_final_stats=1 skin-corpus
      - name: Lưu đầu vào gây lỗi của fuzzer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ github.sha }}
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.platform }}
    needs: i18n-check
    runs-on: windows-2022   # Ghim VS 2022 (v143 + MFC); windows-latest dùng VS 2026 chưa có MFC cho v143
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            outdir: Bin/x64/Release (lite)
          - platform: x86
            outdir: Bin/Release (lite)
          - platform: ARM64EC
            outdir: Bin/ARM64EC/Release (lite)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Thêm MSBuild vào PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Build TrafficMonitor (Lite)
        env:
          # Coi các cảnh báo ép kiểu số / cắt con trỏ / ký tự ngoài code page là lỗi để không phát sinh lại
          CL: /we4244 /we4267 /we4018 /we4302 /we4311 /we4566
        run: msbuild TrafficMonitor_Lite.sln -m -p:Configuration="Release (lite)" -p:Platform=${{ matrix.platform }} -p:PlatformToolset=v143

      - name: Kiểm tra cờ bảo mật của tệp thực thi
        shell: pwsh
        run: |
          $exe = Join-Path "${{ matrix.outdir }}" "TrafficMonitor.exe"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $headers = & $dumpbin /headers /loadconfig $exe | Out-String
          $required = @("Dynamic base", "NX compatible", "Guard")
          if ("${{ matrix.platform }}" -ne "ARM64EC") { $required += "CET compatible" }
          $missing = $required | Where-Object { $headers -notmatch [regex]::Escape($_) }
          if ($missing) { Write-Error "Thiếu cờ bảo mật: $($missing -join ', ')"; exit 1 }
          Write-Host "Đủ cờ bảo mật: $($required -join ', ')"

      - name: Build tái lập - đóng gói (như release.yml), build lại, so SHA-256 exe và zip
        shell: pwsh
        env:
          CL: /we4244 /we4267 /we4018 /we4302 /we4311 /we4566   # giống bước Build ở trên
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "${{ matrix.outdir }}"
          $exe = Join-Path $out "TrafficMonitor.exe"
          $epoch = [long](git log -1 --format=%ct)
          $name = "tsudev-trafficmonitor_0.0_${{ matrix.platform }}_Lite"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $stamp1 = (& $dumpbin /headers $exe | Select-String "time date stamp").Line.Trim()
          $exe1 = (Get-FileHash $exe -Algorithm SHA256).Hash
          ./tools/make_package.ps1 -Name $name -BinDir $out -WorkDir (Join-Path $env:RUNNER_TEMP "goi1") -OutZip "goi1.zip" -Epoch $epoch
          $zip1 = (Get-FileHash goi1.zip -Algorithm SHA256).Hash

          # Build lại từ đầu (Rebuild) và đóng gói ở thư mục tạm khác
          msbuild TrafficMonitor_Lite.sln -m -t:Rebuild -p:Configuration="Release (lite)" -p:Platform=${{ matrix.platform }} -p:PlatformToolset=v143 -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { throw "Build lại thất bại" }
          $stamp2 = (& $dumpbin /headers $exe | Select-String "time date stamp").Line.Trim()
          $exe2 = (Get-FileHash $exe -Algorithm SHA256).Hash
          ./tools/make_package.ps1 -Name $name -BinDir $out -WorkDir (Join-Path $env:RUNNER_TEMP "goi2") -OutZip "goi2.zip" -Epoch $epoch
          $zip2 = (Get-FileHash goi2.zip -Algorithm SHA256).Hash

          "PE timestamp 1: $stamp1"; "PE timestamp 2: $stamp2"
          "exe: $exe1 / $exe2"; "zip: $zip1 / $zip2"
          if ($stamp1 -ne $stamp2) { Write-Error "PE timestamp khác nhau giữa hai lần build (/Brepro không có tác dụng?)" }
          if ($exe1 -ne $exe2) { Write-Error "TrafficMonitor.exe KHÔNG tái lập được (SHA-256 khác giữa hai lần build)" }
          if ($zip1 -ne $zip2) { Write-Error "Gói zip KHÔNG tái lập được" }
          if ($stamp1 -ne $stamp2 -or $exe1 -ne $exe2 -or $zip1 -ne $zip2) { exit 1 }
          "Build tái lập: exe và zip giống nhau từng byte"

      - name: Tải lên artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: TrafficMonitor-VN_${{ matrix.platform }}_Lite_${{ github.sha }}
          path: |
            ${{ matrix.outdir }}/TrafficMonitor.exe
            ${{ matrix.outdir }}/*.dll
            ${{ matrix.outdir }}/*.pdb
          if-no-files-found: error
          retention-days: 14

  build-full:
    # Bản đầy đủ (có đo nhiệt độ qua OpenHardwareMonitorApi C++/CLI) không phát hành, nhưng vẫn build để
    # bắt cảnh báo/lỗi trong mã #ifndef WITHOUT_TEMPERATURE. Không phải check bắt buộc của PR.
    name: Build bản đầy đủ x64 (không phát hành)
    needs: i18n-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Thêm MSBuild vào PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Build TrafficMonitor (bản đầy đủ)
        env:
          CL: /we4244 /we4267 /we4018 /we4302 /we4311 /we4566
        run: msbuild TrafficMonitor.sln -m -restore -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143
