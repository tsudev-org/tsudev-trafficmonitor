# Phát hành: khi đẩy tag dạng V1.86-vn, build bản Lite cho 3 nền tảng, đóng gói zip,
# tạo SHA256SUMS.txt, chứng thực nguồn gốc build (provenance) và tạo GitHub Release.
#
# Quy trình phát hành:
#   Phiên bản theo khuôn {YY}.{M}.{DD}{NN} (VERSIONING.md của tsudev), ví dụ tag V26.11.0901-vn,
#   gói tsudev-trafficmonitor_26.11.0901_x64_Lite.zip.
#   1. Cập nhật VERSION trong tsudev-trafficmonitor/stdafx.h và version_utf8.info (liên kết tải cho bản cũ V1.86/V1.87,
#      nội dung cập nhật - cũng được đưa vào version_signed.xml có chữ ký mà bản V1.88+ đọc).
#   2. git tag V<phiên bản>-vn && git push origin V<phiên bản>-vn
name: Release

on:
  push:
    tags: ["V*-vn"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cần phát hành (ví dụ V1.86-vn), tag phải tồn tại"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022   # Ghim VS 2022 (v143 + MFC); windows-latest dùng VS 2026 chưa có MFC cho v143
    permissions:
      contents: read
      id-token: write       # cần cho chứng thực nguồn gốc build
      attestations: write
    strategy:
      matrix:
        include:
          - platform: x64
            arch: x64
            outdir: Bin/x64/Release (lite)
          - platform: x86
            arch: x86
            outdir: Bin/Release (lite)
          - platform: ARM64EC
            arch: arm64ec
            outdir: Bin/ARM64EC/Release (lite)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Xác định phiên bản
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^V(\d+(\.\d+){0,3})-vn$') { Write-Error "Tag không hợp lệ: $tag"; exit 1 }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build
        run: msbuild tsudev-trafficmonitor_Lite.sln -m -p:Configuration="Release (lite)" -p:Platform=${{ matrix.platform }} -p:PlatformToolset=v143

      - name: Đóng gói (zip tất định, tools/make_package.ps1 - cùng script với bước thử trong build.yml)
        id: pkg
        shell: pwsh
        run: |
          $name = "tsudev-trafficmonitor_${{ steps.ver.outputs.version }}_${{ matrix.arch }}_Lite"
          $zip = "$name.zip"
          $epoch = [long](git log -1 --format=%ct)
          ./tools/make_package.ps1 -Name $name -BinDir "${{ matrix.outdir }}" -WorkDir $env:RUNNER_TEMP -OutZip $zip -Epoch $epoch
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Chứng thực nguồn gốc build
        # Artifact attestation miễn phí cho repo công khai; repo riêng tư cần GitHub Enterprise Cloud
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Sinh SBOM (SPDX 2.3)
        # bash + "-X utf8": stdout của Python trên runner Windows mặc định cp1252; chuyển hướng của bash giữ nguyên từng byte
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python -I -X utf8 tools/make_sbom.py --zip "$ZIP" --version "$VERSION" --commit "$(git rev-parse HEAD)" > "$ZIP.spdx.json"
          python -I -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['spdxVersion']=='SPDX-2.3'" "$ZIP.spdx.json"

      - name: Chứng thực SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}
          sbom-path: ${{ steps.pkg.outputs.zip }}.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.arch }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.spdx.json
          if-no-files-found: error

  publish:
    name: Tạo GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release   # cần tsudev-tsudev duyệt trước khi tạo Release (thiết lập ở Settings → Environments)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Tạo SHA256SUMS.txt
        working-directory: dist
        run: sha256sum *.zip | tee SHA256SUMS.txt

      - name: Tạo và ký thông tin phiên bản (version_signed.xml)
        # Ứng dụng (từ V1.88-vn) chỉ tin thông tin phiên bản khi chữ ký ECDSA P-256 hợp lệ với khóa công khai
        # nhúng trong ForkConfig.h. Khóa bí mật chỉ có trong secret của environment "release".
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "Thiếu secret UPDATE_SIGNING_KEY"; exit 1; }
          # Liên kết tải trong manifest LUÔN theo owner cũ tsudev-tsudev: bản đã cài (<= 26.11.0902) chỉ tin tiền tố này;
          # repo đã chuyển sang tsudev-org nên GitHub chuyển hướng URL cũ. Không đổi sang $GITHUB_REPOSITORY.
          python3 -I tools/version_manifest.py build --tag "$TAG" --dist dist --repo "tsudev-tsudev/tsudev-trafficmonitor" > dist/version_signed.xml
          umask 077
          key="$RUNNER_TEMP/update_key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out "$RUNNER_TEMP/sig.der" dist/version_signed.xml
          rm -f "$key"
          openssl dgst -sha256 -verify tools/keys/update_signing_pub.pem -signature "$RUNNER_TEMP/sig.der" dist/version_signed.xml
          python3 -I tools/version_manifest.py der2raw "$RUNNER_TEMP/sig.der" > dist/version_signed.xml.sig
          cat dist/version_signed.xml

      - name: Tạo Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip dist/*.spdx.json dist/SHA256SUMS.txt dist/version_signed.xml dist/version_signed.xml.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "tsudev-trafficmonitor $TAG" \
            --notes "Xem nhật ký thay đổi: https://github.com/$GITHUB_REPOSITORY/blob/main/UpdateLog/update_log_vi.md

          Kiểm tra mã băm SHA-256 trong SHA256SUMS.txt và chứng thực nguồn gốc build (gh attestation verify) trước khi sử dụng - xem SECURITY.md. Mỗi gói kèm SBOM SPDX (*.spdx.json) có chứng thực."
