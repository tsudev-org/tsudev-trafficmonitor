# Quét lỗ hổng bảo mật mã C/C++ bằng CodeQL (mỗi lần push/PR và hằng tuần)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # 09:17 thứ Hai (giờ Việt Nam)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Phân tích C/C++
    runs-on: windows-2022   # Ghim VS 2022 (v143 + MFC); windows-latest dùng VS 2026 chưa có MFC cho v143
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild TrafficMonitor_Lite.sln -m -p:Configuration="Release (lite)" -p:Platform=x64 -p:PlatformToolset=v143

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
