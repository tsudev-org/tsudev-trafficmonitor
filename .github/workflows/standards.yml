# Cổng kiểm quy ước tsudev (SECURITY_BASELINE mục 4.3, GITIGNORE_POLICY mục 7, BRAND_ASSETS mục 12.2).
name: Chuẩn tsudev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    name: Cổng kiểm quy ước
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Bản sao quy ước chưa bị sửa
        run: bash scripts/sync-standards.sh --check
      - name: check-standards.sh
        run: bash scripts/check-standards.sh
      - name: Tài sản nhận diện bắt buộc
        run: |
          set -e
          for f in website/public/favicon.ico website/public/favicon-96x96.png website/public/apple-touch-icon.png \
                   website/public/og-image.png TrafficMonitor/res/TrafficMonitor.ico; do
            test -f "$f" || { echo "Thiếu tài sản bắt buộc: $f (BRAND_ASSETS.md mục 12)"; exit 1; }
          done

  gitleaks:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Chính sách Actions của repo chỉ cho action của GitHub (+ setup-msbuild), nên không dùng
      # gitleaks/gitleaks-action: tải bản phát hành chính thức, kiểm SHA-256 ghim sẵn rồi chạy.
      - name: Cài gitleaks (kiểm SHA-256)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Quét toàn bộ lịch sử
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  npm-audit:
    name: Lỗ hổng phụ thuộc website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - run: npm audit --audit-level=high --omit=dev
